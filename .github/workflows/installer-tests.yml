name: installer-tests

# Guards the one-file installer (laranode-scripts/bin/laranode-installer.sh) on a real
# Linux runner: host-only unit tests, a mutation smoke (every guard must go red when
# its fix is reverted), and the clean-room container scenarios that matter most for
# "never break a host that already has services".
on:
  pull_request:
    paths:
      - 'laranode-scripts/**'
      - 'local-dev/install-test/**'
      - '.github/workflows/installer-tests.yml'
  push:
    branches: [development]
    paths:
      - 'laranode-scripts/**'
      - 'local-dev/install-test/**'
      - '.github/workflows/installer-tests.yml'

permissions:
  contents: read

concurrency:
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: helper tests
        run: bash local-dev/install-test/unit/test-helpers.sh
      - name: host-detection tests (OS, Proxmox, CloudPanel, ownership, ports, phases)
        run: bash local-dev/install-test/unit/test-host-detection.sh
      - name: template tests
        run: bash local-dev/install-test/unit/test-templates.sh

  sudo-hardening:
    name: sudo hardening (perms + hostile arguments, stubbed host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: installed perms + hostile arguments for every sudo'd script
        run: bash local-dev/install-test/sudo-hardening/run-fast.sh

  mutation-smoke-sudo:
    # 74+ mutations x one full fast harness each outgrew one 45-min job (PR #11 r1): 3 shards in
    # parallel, each must end with its own verdict (ALL KILLED) well inside the timeout
    name: mutation smoke, sudo guards ${{ matrix.shard }}/3 (each guard must go red)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: SHARD=${{ matrix.shard }}/3 JOBS=4 bash local-dev/install-test/mutation-smoke-sudo.sh

  mutation-smoke:
    # 103 mutations took 28 of 30 min (PR #11 r1); 113+ would not fit: 2 shards in parallel
    name: mutation smoke ${{ matrix.shard }}/2 (each guard must go red)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: SHARD=${{ matrix.shard }}/2 bash local-dev/install-test/mutation-smoke.sh

  scenario:
    name: scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every container scenario runs on every change (one job each, in parallel, so the
        # wall time is the slowest single scenario, not the sum).
        #   clean room: baseline, mysql-rootpw, pgsql, rerun, debian13
        #   host guards: pve, pve-webuser, cloudpanel
        #   upgrade: pve-upgrade (installs an older ref first: needs the full history)
        #   pre-existing services: nginx80, apache80, apache-stopped, phpfpm-live, port-busy
        scenario:
          - baseline
          - nginx80
          - mysql-rootpw
          - pgsql
          - rerun
          - debian13
          - pve
          - pve-webuser
          - pve-upgrade
          - cloudpanel
          - apache80
          - port-busy
          - apache-stopped
          - phpfpm-live
          - nginx-dualstack
          - apache-badconf
    steps:
      - uses: actions/checkout@v4
        with:
          # pve-upgrade git-archives the older ref it upgrades from
          fetch-depth: ${{ matrix.scenario == 'pve-upgrade' && '0' || '1' }}
      - name: run scenario
        env:
          LARANODE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash local-dev/install-test/run.sh "${{ matrix.scenario }}"
